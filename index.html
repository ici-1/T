<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue</title>

    <!-- Scripts de régie publicitaire -->
    <script src="https://pl31295417.profitableratecpmnetwork.com/d0/9c/97/d09c97569a8d24ef2122d37226469387.js"></script>
    <script src="https://pl31295418.profitableratecpmnetwork.com/c9/24/fb/c924fbacbaea585001479cfa19d4a81e.js"></script>

    <style>
        /* Réinitialisation de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Style du fond attrayant avec dégradé animé */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Carte centrale avec effet de verre (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Zone d'affichage de la publicité */
        .ad-container {
            margin-bottom: 25px;
            max-width: 100%;
            overflow: hidden;
            border-radius: 8px;
        }

        /* Style du bouton attrayant */
        .btn-visit {
            background: #ffffff;
            color: #e73c7e;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            outline: none;
        }

        /* Effet au survol du bouton */
        .btn-visit:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: #fff;
            color: #23a6d5;
        }

        .btn-visit:active {
            transform: translateY(1px);
        }

        /* Style du message "Excellent !" */
        #message {
            margin-top: 25px;
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* Classe d'animation du message */
        #message.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Découvrir</h1>

        <!-- Emplacement de l'annonce d'affichage -->
        <div class="ad-container">
            <script>
              atOptions = {
                'key' : '1f0ebde21c360cac6ed6990938d9afe9',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/1f0ebde21c360cac6ed6990938d9afe9/invoke.js"></script>
        </div>

        <button class="btn-visit" onclick="afficherMessage()">Visiter</button>
        <div id="message">✨ Excellent ! ✨</div>
    </div>

    <script>
        function afficherMessage() {
            const message = document.getElementById('message');
            message.classList.toggle('show');
        }
    </script>

</body>
</html>
