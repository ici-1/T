<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Emojis animés */
        .emoji-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }

        .emoji {
            font-size: 2.5rem;
            animation: emojiFloat 10s linear infinite;
        }

        .emoji:nth-child(1) { animation-delay: 0s; }
        .emoji:nth-child(2) { animation-delay: 2s; }
        .emoji:nth-child(3) { animation-delay: 4s; }
        .emoji:nth-child(4) { animation-delay: 1s; }
        .emoji:nth-child(5) { animation-delay: 3s; }
        .emoji:nth-child(6) { animation-delay: 5s; }

        @keyframes emojiFloat {
            0% { transform: translateY(105vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Carte centrale */
        .card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .card h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .ad-container {
            margin-bottom: 25px;
            min-height: 60px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-visit {
            background: #ffffff;
            color: #e73c7e;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .btn-visit:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            color: #23a6d5;
        }

        #message {
            margin-top: 20px;
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        #message.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <!-- Arrière-plan Emojis -->
    <div class="emoji-background">
        <span class="emoji">🍆</span>
        <span class="emoji">🫦</span>
        <span class="emoji">🍑</span>
        <span class="emoji">🍆</span>
        <span class="emoji">🫦</span>
        <span class="emoji">🍑</span>
    </div>

    <!-- Carte Centrale -->
    <div class="card">
        <h1>Bienvenue</h1>

        <!-- Emplacement de la bannière de pub -->
        <div class="ad-container">
            <script type="text/javascript">
                atOptions = {
                    'key' : '1f0ebde21c360cac6ed6990938d9afe9',
                    'format' : 'iframe',
                    'height' : 60,
                    'width' : 468,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="https://www.highrevenueformat.com/1f0ebde21c360cac6ed6990938d9afe9/invoke.js"></script>
        </div>

        <button class="btn-visit" onclick="afficherMessage()">Visiter</button>
        <div id="message">✨ try again ! ✨</div>
    </div>

    <!-- Scripts Popunder / Réseau publicitaire -->
    <https://www.profitableratecpmnetwork.com/nre5qqpm6?key=149c3b14d29e9c6ef634566c7d570471
        

    <script>
        function afficherMessage() {
            const message = document.getElementById('message');
            message.classList.toggle('show');
        }
    </script>
</body>
</html>
